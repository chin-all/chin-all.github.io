<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面不存在</title>
<!--
  GitHub Pages 找不到页面时会自动显示这一页。
  重新初始化之后，旧博客的文章地址（/posts/xxx/）全部会落到这里，
  所以给一个回首页的出口，而不是让人看到 GitHub 的默认 404。
-->
<style>
  :root { color-scheme: light; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
         background: #fafafa; color: #444; display: flex; min-height: 100vh;
         align-items: center; justify-content: center; margin: 0; text-align: center; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
  p { color: #888; font-size: 14px; }
  a { color: #0a66c2; }
</style>
</head>
<body>
  <div>
    <h1>这个页面不存在</h1>
    <p>可能已经移走了。<a href="/">回到首页</a></p>
  </div>
</body>
</html>
